name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 与 GitHub 官方 Pages 模板一致：不取消进行中的运行（取消会把 Pages 部署腰斩），新 push 排队等待
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 等价于 withastro/action@v3 的步骤展开（setup-node → install → build → upload-pages-artifact@v3），
      # 区别：用 npm ci 确定性安装（那个 action 写死了 npm install）、Node 版本取 .nvmrc（action 默认 20），
      # 并在构建前跑检查。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check site.js syntax
        run: node --check src/scripts/site.js

      - name: Eval smoke site.js
        run: node scripts/eval-smoke.cjs src/scripts/site.js

      - name: Unit tests
        run: node scripts/run-tests.mjs

      - name: Build with Astro
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # 走重试分支时 URL 来自 deployment-retry；首发成功时重试被跳过、输出为空，回落到首发的 URL
      url: ${{ steps.deployment-retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Retry deploy once on flake
        if: steps.deployment.outcome == 'failure'
        id: deployment-retry
        uses: actions/deploy-pages@v4
