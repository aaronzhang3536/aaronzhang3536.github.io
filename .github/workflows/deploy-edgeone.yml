# 国内镜像：腾讯云 EdgeOne Pages（与 deploy.yml 的 GitHub Pages 部署并行，互不影响）
# 前置：EdgeOne Pages 控制台生成 API Token，存入仓库 Secret EDGEONE_API_TOKEN。
# 未配置 Secret 时本 workflow 直接跳过，不会失败。
# sync-api（yzzn-sync）在 deploy-sync-api.yml 里单独部署，两边失败互不牵连。
name: Deploy EdgeOne Pages (国内镜像)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeone-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      # CLI 锁精确版本：每次运行都会把 API Token 交给它，不能跟着 latest 漂。升级时与 deploy-sync-api.yml 一起改。
      EDGEONE_CLI: edgeone@1.6.41
      PROJECT_NAME: within-one-frame
    steps:
      - name: 检查 Token
        if: env.EDGEONE_API_TOKEN == ''
        run: echo "::notice::EDGEONE_API_TOKEN 未配置，跳过国内镜像部署（EdgeOne Pages 控制台 → API Token → 创建后存入仓库 Secret）"

      - uses: actions/checkout@v4
        if: env.EDGEONE_API_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.EDGEONE_API_TOKEN != ''
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: env.EDGEONE_API_TOKEN != ''
        run: npm ci

      # 与 deploy.yml 同一组检查：Pages 被拦下时镜像也不该上线坏版本
      - name: Checks (site.js syntax, eval smoke, unit tests)
        if: env.EDGEONE_API_TOKEN != ''
        run: |
          node --check src/scripts/site.js
          node scripts/eval-smoke.cjs src/scripts/site.js
          node scripts/run-tests.mjs

      - name: Build
        if: env.EDGEONE_API_TOKEN != ''
        run: npm run build

      - name: Deploy to EdgeOne Makers
        if: env.EDGEONE_API_TOKEN != ''
        run: npx --yes "$EDGEONE_CLI" makers deploy dist -n "$PROJECT_NAME" -t "$EDGEONE_API_TOKEN"
